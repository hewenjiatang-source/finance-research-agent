# Input of scripts/build_finance_cases.py: company + fiscal year + question.
# The gold values are XBRL numbers pulled from SEC companyfacts when the cases are built.
# fiscal_year follows the "fy" in the filing (Apple's FY2023 ends 2023-09-30).
- {id: aapl-fy2023, ticker: AAPL, fiscal_year: 2023, aliases: [Apple],
   query: "Compare Apple's FY2023 and FY2022 revenue, net income and diluted EPS, and summarize the main drivers discussed in MD&A"}
- {id: msft-fy2023, ticker: MSFT, fiscal_year: 2023, aliases: [Microsoft],
   query: "Summarize Microsoft's FY2023 revenue, operating income and net income versus FY2022, with the main drivers cited from the 10-K"}
- {id: nvda-fy2024, ticker: NVDA, fiscal_year: 2024, aliases: [NVIDIA],
   query: "How did NVIDIA's FY2024 revenue, gross profit and net income change year over year, and how much did the Data Center segment contribute?"}
- {id: amzn-fy2023, ticker: AMZN, fiscal_year: 2023, aliases: [Amazon],
   query: "Amazon FY2023 net sales, operating income, net income and operating cash flow compared with FY2022"}
