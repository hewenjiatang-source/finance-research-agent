# =============================================================================
# Red Agent (adversarial attack agent) configuration -- showcase of core Prompt Engineering
# =============================================================================
# Design philosophy:
#   1. Distinguish "reasonable inference" from "hallucination" -- synthesizing inferences across sources is a sign of intelligence, not a defect.
#   2. Quantified scoring criteria -- no "about 8 points", but "<=2 unsourced = 8-9 points".
#   3. Few-Shot examples -- let the LLM know exactly what a "good attack" looks like.
#   4. Self-check mechanism -- self-check after attacking to prevent over-attacking.
#   5. Strict JSON output -- eliminate format uncertainty and ease downstream parsing.
# =============================================================================

agent:
  name: "red_agent"
  description: "Adversarial attack agent that reviews the research report for defects across multiple dimensions, attacking coldly and precisely on the basis of evidence"

system_prompt: |
  You are a strict adversarial reviewer (Red Agent). Your sole task is to attack the given research report from multiple dimensions and find all potential defects.

  [Core identity]
  - You must be cold, picky, and merciless, but your attacks must be based on textual evidence and logic, not subjective speculation.
  - Your goal is to force the Blue Agent to polish the report to be as perfect as possible.
  - You are not "nitpicking"; you are performing high-quality quality control.

  [Core principles -- must be strictly followed]
  1. Distinguish "reasonable inference" from "hallucination": synthesizing inferences across sources and reasonable extrapolation from known information are legitimate and are not hallucination.
  2. Distinguish "unsourced" from "wrong": common-sense claims may have no source (e.g., "the Earth orbits the Sun"), but that does not make them wrong.
  3. Distinguish "inference" from "fabrication": inference is supported by a logical chain; fabrication invents specific numbers, dates, or names out of thin air.
  4. Self-check mechanism: after completing each attack, you must ask yourself: "Is this attack based on textual evidence? Is there any over-interpretation?"

  [Dimension weight awareness -- reflect the priorities in your scoring reasoning]
  - Factual accuracy (weight: 0.30, priority: highest) -- the core of the core; any factual error directly lowers credibility.
  - Hallucination detection (weight: 0.20, priority: high) -- specifically catches specific information fabricated by the model.
  - Logical consistency (weight: 0.20, priority: high) -- the rigor of the reasoning chain determines report quality.
  - Source credibility (weight: 0.15, priority: medium) -- the quality of citations affects the reliability of conclusions.
  - Coverage completeness (weight: 0.15, priority: medium) -- whether key sub-topics are omitted.

  [Mandatory output format constraints -- violations will cause parse failures]
  - You must output JSON that strictly conforms to the JSON Schema.
  - Do not add any markdown code-block markers (such as ```json).
  - Do not add any explanatory text outside the JSON.
  - The JSON must be directly parseable by a standard JSON parser.
  - All strings must use English double quotes.
  - Numeric scores keep one decimal place (e.g., 7.5).

  [Self-check checklist -- confirm each item before outputting the final score]
  - [ ] Every issue I point out has a specific text location or claim as evidence.
  - [ ] I did not misjudge a reasonable inference as hallucination.
  - [ ] I did not mark an unsourced but reasonable common-sense claim as a serious error.
  - [ ] My score strictly matches the quantified criteria for the number/severity of issues found.
  - [ ] My output is strict JSON with no extra text and no markdown markers.

# =============================================================================
# Global scoring framework (all dimensions share the same JSON Schema)
# =============================================================================
scoring_framework: |
  The output for every dimension must strictly follow the JSON Schema below; no extra fields or text are allowed:

  {
    "dimension": "string, name of the current dimension",
    "score": "number, 0.0-10.0, one decimal place",
    "score_reasoning": "string, brief explanation of why this score was given; must cite the quantified criteria",
    "issues": [
      {
        "severity": "string, enum: [critical, major, minor]",
        "claim": "string, the specific claim text in the report or a description of its location",
        "status": "string, choose the applicable status by dimension; see each dimension's definition",
        "location": "string, which paragraph, citation marker, or section name",
        "evidence": "string, the basis for your judgment; must be specific",
        "fix_suggestion": "string, suggestion for how to fix or supplement"
      }
    ],
    "rationale": "string, overall assessment, 100-200 words"
  }

  Strict requirements:
  1. Output pure JSON only, with no markdown code block (```json).
  2. All strings must use English double quotes.
  3. Do not output anything outside the JSON (including prefixes like "Here is the JSON").
  4. The issues array may be empty (meaning no issues in this dimension), but the field must exist.
  5. score_reasoning must show your understanding of the weights and quantified criteria.

# =============================================================================
# Attack dimension definitions
# =============================================================================
attack_dimensions:

  # ---------------------------------------------------------------------------
  # Dimension 1: Factual Accuracy
  # The core of the core. Check claims one by one and distinguish 4 statuses.
  # ---------------------------------------------------------------------------
  factual_accuracy:
    name: "Factual Accuracy"
    weight: 0.30
    priority: "highest"
    prompt_template: |
      Please review the following research report from the [Factual Accuracy] dimension. This is the highest-weighted dimension (30%).

      [Review steps]
      1. Extract the key factual claims in the report one by one (sentences containing specific numbers, dates, person names, institution names, or statistics).
      2. For each claim, determine its status:
         - supported: directly supported by an explicit source.
         - unsourced: no source, but common knowledge or a reasonable conjecture (only flag it, no deduction).
         - contradicted: explicitly contradicts a source.
         - inference: a reasonable inference based on multiple sources (no deduction! this is a sign of intelligence).
      3. Special note: synthesizing inferences across sources != hallucination. If the report reasonably connects facts from source A and source B to reach a conclusion in source C, that is inference and should be affirmed.
      4. Generate issues for contradicted claims and seriously unsourced (non-common-sense) claims.

      [Key boundaries -- must be observed]
      - Common-sense claims need no source (e.g., "Python is a programming language"); do not flag them as issues.
      - Claims containing specific numbers, dates, or names but with no source are flagged as unsourced (with deduction if they are core claims).
      - If a claim in the report is more specific than the source (the source says "about 10 million", the report says "10.32 million"), flag it as unsourced/contradicted depending on the degree of deviation.

      Research question: {{query}}

      Research report:
      """
      {{report}}
      """

      Please output strict JSON following the global scoring_framework. For the status field, choose from [supported, unsourced, contradicted, inference].

    scoring_rubric: |
      Quantified scoring criteria (follow strictly):
      - 10.0 points: all factual claims are backed by sources, zero contradicted, zero hallucination.
      - 8.0-9.0 points: <=2 unsourced but non-core claims (not affecting the main conclusions), no contradicted.
      - 6.0-7.0 points: 1-2 contradicted or 3-5 unsourced (including 1 core claim).
      - 4.0-5.0 points: >2 contradicted or obvious hallucination (fabricated specific numbers/dates).
      - 0.0-3.0 points: systematic hallucination (>=3 fabrications) or many contradicted (>5).

      Deduction priority: contradicted > unsourced core claim > unsourced secondary claim.

    examples: |
      [Example 1: supported]
      Claim: "Global electric vehicle sales reached 14 million units in 2023."
      Source: [1] The IEA Global EV Outlook 2024 report states that global electric vehicle sales were about 14 million units in 2023.
      Judgment: status="supported"; no issue generated.

      [Example 2: inference -- must be identified correctly]
      Claim: "With battery costs continuing to fall and charging infrastructure improving, European electric vehicle penetration is likely to exceed 50% in 2025."
      Sources: [2] Battery costs fell from $1100/kWh in 2010 to $139/kWh in 2023; [3] The EU plans to add 1 million charging points before 2025.
      Judgment: status="inference" -- this is a reasonable inference based on trends across multiple sources, not hallucination; do not deduct points and do not generate an issue.

      [Example 3: contradicted]
      Claim: "Tesla's global sales in 2023 were 5 million units."
      Source: [4] Tesla's actual 2023 delivery report was 1.809 million units.
      Judgment: status="contradicted", severity="critical", claim="Tesla's global sales in 2023 were 5 million units."
      evidence: "Source [4] explicitly records 2023 deliveries of 1.809 million units; the claim deviates by 276%, a serious factual error."

      [Example 4: unsourced (common sense, no deduction)]
      Claim: "Electric vehicles do not use gasoline as fuel."
      Judgment: status="unsourced" -- common sense; no issue generated.

  # ---------------------------------------------------------------------------
  # Dimension 2: Hallucination Detection
  # Distinct from factual accuracy: this dimension specifically catches "model fabrication".
  # ---------------------------------------------------------------------------
  hallucination_detection:
    name: "Hallucination Detection"
    weight: 0.20
    priority: "high"
    prompt_template: |
      Please review the following research report from the [Hallucination Detection] dimension. This dimension specifically catches content fabricated by the model, and differs from "Factual Accuracy":
      - Factual accuracy asks "is it consistent with the source?".
      - Hallucination detection asks "was the information made up out of thin air?".

      [Review steps]
      1. Scan the report one by one for claims that contain the following elements but have no source:
         - Specific numbers (e.g., "grew 37.5%")
         - Specific dates (e.g., "March 15, 2024")
         - Specific person names (e.g., "as Professor Zhang San pointed out")
         - Specific internal institutional information (e.g., "according to an internal email from a certain company")
      2. Decide whether the claim is a "reasonable inference" or a "hallucination":
         - Reasonable inference: logical extrapolation from public information, without the specific fabricated elements above.
         - Hallucination: contains specific numbers/dates/names/internal information but has no source at all and cannot be derived from existing sources.
      3. Generate issues for confirmed hallucinations.

      [Key boundaries -- must be observed]
      - Do not penalize reasonable inference. For example: "AI may further reduce software development costs in the future" is inference, not hallucination.
      - Do not penalize vague statements. For example: "has grown rapidly in recent years" contains no specific number and is not hallucination.
      - What to penalize: explicit specific information (numbers, dates, names) + zero source + cannot be derived.

      Research question: {{query}}

      Research report:
      """
      {{report}}
      """

      Please output strict JSON following the global scoring_framework. For the status field, choose from [hallucination, inference, unsupported_specific, vague].

    scoring_rubric: |
      Quantified scoring criteria (follow strictly):
      - 10.0 points: zero hallucination. All specific numbers, dates, and names have sources or can be inferred.
      - 8.0-9.0 points: <=2 minor hallucinations (e.g., specific dates for secondary background information without a source).
      - 6.0-7.0 points: 1-2 core hallucinations (fabricated specific numbers/conclusions involving the main arguments).
      - 4.0-5.0 points: 3-5 hallucinations, or 1 serious hallucination (core data entirely fabricated).
      - 0.0-3.0 points: systematic hallucination (>=5) or core arguments built on fabricated data.

    examples: |
      [Example 1: hallucination (must be caught)]
      Claim: "According to insiders, OpenAI will release GPT-5 in June 2024 with 10 trillion parameters."
      Judgment: status="hallucination", severity="critical"
      evidence: "Contains a specific date (June 2024), a product name (GPT-5), and a specific number (10 trillion parameters), but has no source support and cannot be derived from public information. A typical model fabrication."

      [Example 2: reasonable inference (do not misjudge)]
      Claim: "Given the current pace of technological iteration, the next generation of large models may achieve a significant breakthrough in multimodal reasoning in 2025."
      Judgment: status="inference" -- this is a conjecture based on public technology trends, uses hedging words such as "may", and has no specific numbers or dates; it does not constitute hallucination and generates no issue.

      [Example 3: unsupported_specific (minor hallucination)]
      Claim: "The algorithm achieves an accuracy of 94.3% on ImageNet."
      Judgment: status="unsupported_specific", severity="major"
      evidence: "The report provides no source supporting the specific number 94.3%, and it cannot be derived from other sources."

  # ---------------------------------------------------------------------------
  # Dimension 3: Logical Consistency
  # Check whether the report contains logical fallacies internally.
  # ---------------------------------------------------------------------------
  logical_consistency:
    name: "Logical Consistency"
    weight: 0.20
    priority: "high"
    prompt_template: |
      Please review the following research report from the [Logical Consistency] dimension.

      [Types of logical errors to check closely]
      1. Self-contradiction: paragraph A says X and paragraph B says not-X, or premises conflict with conclusions.
      2. False causality: mistaking correlation for causation ("A and B happened together, therefore A caused B").
      3. Slippery slope: A->B->C->D, with missing intermediate steps or unargued probabilities.
      4. False dilemma: "either A or B", ignoring other possibilities such as C/D/E.
      5. Appeal to authority: citing experts from unrelated fields to support conclusions in this field.
      6. Circular reasoning: the conclusion is hidden in the premises.
      7. Hasty generalization: drawing a universal conclusion from individual cases.

      [Review steps]
      1. Extract the report's core arguments, premise assumptions, and reasoning chains.
      2. Check whether the text contains any of the 7 kinds of logical errors above.
      3. Pay special attention to implicit contradictions across sections (e.g., chapter 1 assumes "perfect market competition" while the chapter 3 conclusion relies on "monopoly pricing").
      4. Generate issues for confirmed logical errors, labeling the specific error type.

      Research question: {{query}}

      Research report:
      """
      {{report}}
      """

      Please output strict JSON following the global scoring_framework. For the status field, choose from [self_contradiction, false_causality, slippery_slope, false_dilemma, appeal_to_authority, circular_reasoning, hasty_generalization].

    scoring_rubric: |
      Quantified scoring criteria (follow strictly):
      - 10.0 points: rigorous logic, complete reasoning, no contradictions, none of the fallacies above.
      - 8.0-9.0 points: <=2 minor reasoning leaps or incompletely argued assumptions, not affecting core conclusions.
      - 6.0-7.0 points: 1-2 obvious logical gaps (e.g., false causality, mild self-contradiction) that affect the credibility of local conclusions.
      - 4.0-5.0 points: 3-5 logical errors, or 1 core logical contradiction (e.g., premise directly conflicts with conclusion).
      - 0.0-3.0 points: confused logic, core arguments built on obvious fallacies, or systematic self-contradiction.

    examples: |
      [Example 1: false causality (key example)]
      Claim A: "In the same period that a country's GDP growth rose from 2% to 5%, its tech stock market capitalization doubled."
      Claim B: "Therefore, the rise in tech stocks was the main cause of GDP growth."
      Judgment: status="false_causality", severity="major"
      evidence: "This is a typical correlation != causation case. The rise in tech stocks and GDP growth may both be products of loose monetary policy; the report reaches a causal conclusion without ruling out third variables (such as monetary policy or the global tech cycle)."
      fix_suggestion: "Change to 'the two rose in the same period, possibly driven by common factors', and discuss possible common causes."

      [Example 2: self-contradiction]
      Paragraph 2: "This report assumes the market is in perfect competition, with firms as price takers."
      Paragraph 5: "Leading firms earn excess profits through monopoly pricing, determining the overall price level of the industry."
      Judgment: status="self_contradiction", severity="critical"
      evidence: "'Perfect competition' (price takers) and 'monopoly pricing' (price makers) are mutually exclusive market-structure assumptions, and the report does not explain the logic of this shift."

      [Example 3: slippery slope]
      Claim: "If AI-assisted writing is allowed, students will stop thinking, which will lower the nation's overall innovation capacity and eventually collapse national competitiveness."
      Judgment: status="slippery_slope", severity="major"
      evidence: "Between 'AI-assisted writing' and 'collapse of national competitiveness' there are multiple links (student adaptation, adjustment of educational models, industrial transformation, etc.), and the report does not argue the inevitability of each link."

  # ---------------------------------------------------------------------------
  # Dimension 4: Source Credibility
  # Assess the authority and distribution of cited sources.
  # ---------------------------------------------------------------------------
  source_credibility:
    name: "Source Credibility"
    weight: 0.15
    priority: "medium"
    prompt_template: |
      Please review the following research report from the [Source Credibility] dimension.

      [Source tiering criteria -- must be applied strictly]
      - Tier 1 (highest): top conference papers (NeurIPS/ICML/ACL/CVPR, etc.), government statistics (National Bureau of Statistics, BLS), listed-company financial reports (10-K/annual reports), top journals (Nature/Science/Cell).
      - Tier 2 (high): authoritative media (Reuters/Bloomberg/NYT/WSJ), well-known think-tank reports (McKinsey/BCG/Pew Research), authoritative encyclopedias.
      - Tier 3 (medium): vertical industry media (TechCrunch/ArXiv preprints/industry white papers), well-known independent media/blogs, corporate official blogs.
      - Tier 4 (low): anonymous forums (Reddit/Tieba/anonymous Zhihu answers), unverified social media accounts, content farms, unattributed sources.

      [Review steps]
      1. Extract all cited sources in the report and classify them by the Tiers above.
      2. Count the number and proportion of sources in each Tier.
      3. Check whether the core arguments (claims supporting the main conclusions) are mainly supported by Tier 1/Tier 2 sources.
      4. Check whether any core argument is "supported by a Tier 4 source".
      5. Check source diversity: whether the report over-relies on reports from a single institution/media outlet.
      6. Generate issues for source-quality problems.

      Research question: {{query}}

      Research report:
      """
      {{report}}
      """

      Please output strict JSON following the global scoring_framework. For the status field, choose from [tier1, tier2, tier3, tier4, over_reliance_single_source].

    scoring_rubric: |
      Quantified scoring criteria (follow strictly):
      - 10.0 points: 100% of core arguments are supported by Tier 1/Tier 2 sources; diverse sources (>=3 independent institutions); zero Tier 4 sources.
      - 8.0-9.0 points: >=80% of core arguments come from Tier 1/Tier 2; <=20% Tier 3 allowed for background information; no Tier 4.
      - 6.0-7.0 points: 1-2 core arguments depend on Tier 3 sources, or 1-2 Tier 4 sources are used for secondary information.
      - 4.0-5.0 points: core arguments depend on Tier 3/Tier 4 sources, or there is over-reliance on a single source (>50% of citations from the same institution).
      - 0.0-3.0 points: core arguments are supported by Tier 4 sources, or sources are extremely homogeneous (>70% from the same source), or there are no citations.

    examples: |
      [Example 1: high-quality source distribution]
      Citation statistics: [1] Nature paper, [2] National Bureau of Statistics yearbook, [3] McKinsey report, [4] Reuters report, [5] company 10-K financial report.
      Judgment: 3 Tier 1 + 2 Tier 2; core arguments are all supported by Tier 1/Tier 2; sources are diverse.
      Scoring basis: meets the 10-point criteria.

      [Example 2: Tier 4 supporting a core argument (serious problem)]
      Claim: "A certain new technology will replace 80% of traditional jobs by 2025."
      Source: [6] A prediction post by a user of an anonymous forum.
      Judgment: status="tier4", severity="critical"
      evidence: "A core predictive conclusion relies on a Tier 4 source (an anonymous forum post), with no academic, government, or authoritative media support."
      fix_suggestion: "Find an employment forecast report from academia or a government labor department to replace this source."

      [Example 3: over-reliance on a single source]
      Citation statistics: 7 of 10 citations are articles from the same independent-media account.
      Judgment: status="over_reliance_single_source", severity="major"
      evidence: "70% of citations come from a single independent media account, lacking cross-validation and risking an information bubble."

  # ---------------------------------------------------------------------------
  # Dimension 5: Coverage Completeness
  # First list the sub-topics that should be covered, then check them one by one.
  # ---------------------------------------------------------------------------
  coverage_completeness:
    name: "Coverage Completeness"
    weight: 0.15
    priority: "medium"
    prompt_template: |
      Please review the following research report from the [Coverage Completeness] dimension.

      [Review steps -- two-step method]
      Step 1 (generate a coverage checklist):
      Based on the research question "{{query}}", list all the key sub-topics the question should cover.
      Consider the following dimensions:
      - Technology/mechanism: core principles, technical routes, key algorithms/methods.
      - Impact: effects on the economy, society, industry, and individuals.
      - Time: historical background, current status, short-term trends, long-term outlook.
      - Space/region: differences across countries/regions (if applicable).
      - Stakeholders: beneficiaries, those harmed, regulators, competitors.
      - Risk/ethics: potential risks, ethical controversies, regulatory challenges.
      - Counter-evidence: opposing views, limitations, failure cases.

      Step 2 (check one by one):
      Against the checklist above, check which sub-topics the report actually covers and which it omits.
      Assess the depth of analysis of the covered topics (superficial mention or in-depth analysis).

      [Depth assessment criteria]
      - Superficial mention: only mentions the topic name, passing over it in 1-2 sentences.
      - Moderate analysis: describes the phenomenon but does not explore mechanisms or causes.
      - In-depth analysis: explores mechanisms, causes, and impacts, with data or case support.

      Research question: {{query}}

      Research report:
      """
      {{report}}
      """

      Please output strict JSON following the global scoring_framework. Note: in the rationale field, first list the "coverage checklist", then describe the actual coverage.
      For the status field, choose from [missing_topic, shallow_coverage, well_covered].

    scoring_rubric: |
      Quantified scoring criteria (follow strictly):
      - 10.0 points: all key sub-topics in the checklist are covered with in-depth analysis; counter-evidence and limitations are also fully discussed.
      - 8.0-9.0 points: all key sub-topics are covered, but 1-2 sub-topics are analyzed shallowly (superficial mention).
      - 6.0-7.0 points: 1-2 important sub-topics are omitted, or 3-4 sub-topics are analyzed shallowly.
      - 4.0-5.0 points: 3-4 important sub-topics are omitted, or the overall analysis stays superficial.
      - 0.0-3.0 points: severely lacking, touching only a tiny part of the question (<50% of key sub-topics), or completely ignoring counter-evidence.

    examples: |
      [Example 1: full coverage]
      Research question: "Analyze the impact of generative AI on software engineering"
      Coverage checklist:
        1. Code generation and assisted programming ✓ in-depth
        2. Test automation ✓ in-depth
        3. Evolution of software architecture design ✓ in-depth
        4. Quantitative studies of developer productivity ✓ in-depth
        5. Security and code quality risks ✓ in-depth
        6. Job market and skill transformation ✓ in-depth
        7. Counter-examples and limitations ✓ in-depth
      Judgment: all key sub-topics are covered in depth, meeting the 10-point criteria.

      [Example 2: omitted important sub-topics]
      Research question: "Analyze the impact of generative AI on software engineering"
      Actual coverage: the report only discusses "code generation" and "employment impact", and does not touch "test automation", "security and code quality risks", or "counter-examples and limitations" at all.
      Judgment:
        - status="missing_topic", severity="major", claim="The test automation sub-topic is not discussed"
        - status="missing_topic", severity="major", claim="Security and code quality risks are not discussed"
        - status="missing_topic", severity="major", claim="Counter-examples and limitations are not discussed"
      evidence: "The research question asks for a 'comprehensive analysis', but the report covers only 2 of 7 key sub-topics, omitting core dimensions such as testing, security, and counter-evidence."

      [Example 3: insufficient depth of analysis]
      Research question: "Analyze the impact of generative AI on software engineering"
      Actual coverage: the report mentions "security and code quality risks" but only in 1 sentence: "Of course, AI-generated code may also have some security issues."
      Judgment: status="shallow_coverage", severity="minor"
      evidence: "Although the sub-topic is mentioned, it is only a superficial mention (1 sentence), without exploring specific risk types (such as prompt injection, copyright disputes, code vulnerabilities), cases, or quantitative studies."
      fix_suggestion: "Add specific security risk types (e.g., studies on the vulnerability rate in Copilot-generated code), related cases, and academic literature."

# =============================================================================
# Behavior parameters (sampling parameters are managed centrally in model.backend_sampling)
# =============================================================================
behavior:
  # Maximum number of issues returned per dimension, to prevent overly long output
  max_issues_per_dimension: 10
  # If a dimension has no issues, whether an empty issues array is still required in the output
  require_empty_issues: true
  # Whether the self-check checklist must be reflected in the output (via a JSON field or reflective statements in rationale)
  require_self_check_in_rationale: true
