# =============================================================================
# Online GRPO (Group Relative Policy Optimization) evolution training configuration
# =============================================================================
# This configuration reuses and adapts the structure of project one (week3_vanilla_grpo.yaml),
# for online self-evolution training of the DeepResearch Agent (M6: Self-Evolution Engine).
# =============================================================================

model:
  # Base model path; supports a HuggingFace model_id or a local path
  path: "Qwen/Qwen2.5-7B-Instruct"
  # Model loading precision
  torch_dtype: "bfloat16"
  # Whether to enable flash_attention_2 acceleration
  attn_implementation: "flash_attention_2"

training:
  # Training algorithm: grpo / ppo / dpo, etc.
  algorithm: "grpo"
  # Total evolution iterations
  num_iterations: 20
  # Number of queries (research questions) sampled per round
  batch_size: 32
  # Sampling group size per query (number of samples within a GRPO group)
  group_size: 8
  # Maximum interaction turns allowed per trajectory (research process)
  max_turns: 15
  # Gradient accumulation steps
  gradient_accumulation_steps: 1
  # Whether to enable mixed-precision training
  mixed_precision: true
  # Random seed (for reproducible experiments)
  seed: 42

optimizer:
  # Optimizer type
  type: "adamw"
  # Learning rate
  lr: 5.0e-6
  # Weight decay
  weight_decay: 0.01
  # Adam beta parameters
  betas: [0.9, 0.999]
  # epsilon
  eps: 1.0e-8
  # Learning rate warmup step ratio
  warmup_ratio: 0.05
  # Learning rate decay schedule
  lr_scheduler_type: "cosine"

grpo:
  # KL divergence penalty coefficient, to keep the policy from drifting too far from the reference model
  kl_coef: 0.01
  # PPO-style policy clipping threshold
  clip_eps: 0.2
  # Advantage estimation method: grpo / gae
  advantage_estimator: "grpo"
  # Whether to normalize using a baseline (the group mean)
  use_baseline: true
  # Reward scaling factor
  reward_scale: 1.0

lora:
  # Whether to enable LoRA efficient fine-tuning
  enabled: true
  # LoRA low-rank dimension r
  rank: 16
  # LoRA scaling factor alpha
  alpha: 32
  # LoRA dropout
  dropout: 0.05
  # Target modules (q_proj / v_proj, etc. of the attention layers)
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  # Whether to fine-tune the embedding layer and lm_head
  modules_to_save: []

reference_model:
  # Whether the reference model is frozen (weights not updated), used to compute the KL divergence
  freeze: true
  # Reference model path; defaults to the same as the training model (frozen after loading)
  path: null

logging:
  # Logging interval (steps)
  log_interval: 10
  # Evaluation interval (iterations)
  eval_interval: 5
  # Checkpoint save interval (iterations)
  save_interval: 5
  # Output directory
  output_dir: "checkpoints/evolution"

hardware:
  # Number of GPUs used for training
  num_gpus: 4
  # Whether to enable DeepSpeed / FSDP
  distributed_backend: "deepspeed"
  # DeepSpeed config file path
  deepspeed_config: "configs/deepspeed/ds_config_zero2.json"
