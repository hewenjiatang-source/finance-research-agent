# =============================================================================
# Reward Shaping configuration
# =============================================================================
# Defines the reward function structure, multi-dimension weights, and shaping parameters used by GRPO in self-evolution training (M6).
# Reward = Σ(weight_i * score_i) + efficiency_bonus + length_penalty
# =============================================================================

reward:
  name: "research_reward"
  description: "Multi-dimensional research-quality reward function for GRPO policy-gradient optimization"

  # ---------------------------------------------------------------------------
  # Five-dimension scoring weights (must align with the Red Agent's five dimensions)
  # ---------------------------------------------------------------------------
  dimensions:
    factual_accuracy:
      name: "Factual Accuracy"
      # Weight of this dimension in the total reward
      weight: 0.25
      # Scoring source: red_agent / judge_model / exact_match
      scorer: "red_agent"
      # Score range
      min_score: 0.0
      max_score: 10.0

    logical_consistency:
      name: "Logical Consistency"
      weight: 0.20
      scorer: "red_agent"
      min_score: 0.0
      max_score: 10.0

    citation_coverage:
      name: "Citation Coverage and Quality"
      weight: 0.20
      scorer: "red_agent"
      min_score: 0.0
      max_score: 10.0

    bias:
      name: "Bias and One-sidedness"
      weight: 0.20
      scorer: "red_agent"
      # Note: for the bias dimension, a higher score means less bias (i.e., more objective)
      min_score: 0.0
      max_score: 10.0

    comprehensiveness:
      name: "Completeness and Depth"
      weight: 0.15
      scorer: "red_agent"
      min_score: 0.0
      max_score: 10.0

  # ---------------------------------------------------------------------------
  # Shaping formula parameters
  # ---------------------------------------------------------------------------
  shaping:
    # Whether to enable reward shaping (avoids sparse rewards)
    enabled: true
    # Intermediate-step reward coefficient: a small positive reward for each completed sub-task
    step_bonus: 0.05
    # Completion reward coefficient: extra reward when the final report is successfully generated
    completion_bonus: 1.0
    # Repetition/loop penalty coefficient: deducted when repeated actions are detected
    repetition_penalty: -0.2
    # Format error penalty: deducted when the report format does not meet requirements
    format_penalty: -0.5

  # ---------------------------------------------------------------------------
  # Efficiency sigmoid parameters
  # ---------------------------------------------------------------------------
  efficiency:
    # Whether to enable the efficiency reward (encourages high-quality reports with fewer tool calls/turns)
    enabled: true
    # Sigmoid center: the ideal number of turns (reward is high below this value and decays above it)
    sigmoid_center: 8.0
    # Sigmoid slope: controls the decay speed (larger means faster decay)
    sigmoid_slope: 0.5
    # Maximum efficiency reward cap (avoids sacrificing quality by over-pursuing short trajectories)
    max_efficiency_bonus: 0.5
    # Efficiency reward formula:
    # efficiency_bonus = max_efficiency_bonus * sigmoid(sigmoid_slope * (sigmoid_center - actual_turns))
    # Positive reward when actual_turns < center; the reward approaches 0 when actual_turns > center

  # ---------------------------------------------------------------------------
  # Length penalty parameters (prevents excessive verbosity)
  # ---------------------------------------------------------------------------
  length_penalty:
    enabled: true
    # Target report length in tokens (approximate)
    target_length: 2048
    # Linear penalty coefficient beyond the target length
    over_length_coef: -0.0001
    # Penalty coefficient below the target length (encourages thorough analysis; not too short)
    under_length_coef: -0.0002

  # ---------------------------------------------------------------------------
  # Reward normalization
  # ---------------------------------------------------------------------------
  normalization:
    # Whether to normalize rewards within a group (zero mean, unit variance)
    enabled: true
    # Normalization method: z_score / min_max / rank
    method: "z_score"
    # Whether to clip outliers
    clip_outliers: true
    # Clipping threshold (multiple of the standard deviation)
    clip_threshold: 3.0
