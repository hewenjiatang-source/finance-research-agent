# =============================================================================
# DeepResearchAgent global default configuration file
# =============================================================================
# This file defines the system's global parameters, model interfaces, module switches, and hyperparameters.
# Submodules can customize configuration by loading this file and overriding specific keys.
# =============================================================================

system:
  # System name and version
  name: "DeepResearchAgent"
  version: "0.1.0"
  # Log level: DEBUG / INFO / WARNING / ERROR
  log_level: "INFO"
  # Working directory for temporary files and output reports
  work_dir: "./outputs"

model:
  # ---------------------------------------------------------------------------
  # Multi-backend LLM configuration
  # ---------------------------------------------------------------------------
  # Backend selection strategy:
  #   - "claude"    : Use the Anthropic Claude API (requires ANTHROPIC_API_KEY in .env) [default]
  #   - "deepseek"  : Use the DeepSeek API (requires DEEPSEEK_API_KEY in .env)
  #   - "vllm"      : Use a local vLLM service (default http://localhost:8000/v1)
  #   - "openai"    : Use the OpenAI API (requires OPENAI_API_KEY in .env)
  #   - "auto"      : Auto-detect; prefer remote backends that have an API key configured
  #
  # All sensitive information (API keys, URLs) is read from .env / .env.local;
  # edit this YAML to switch backends without changing source code.
  # ---------------------------------------------------------------------------
  backend: "claude"            # Default backend name

  # The following are explicit settings kept for backward compatibility (lower priority than .env).
  # Recommended: configure in .env and leave these empty or commented out.
  # base_model: "Qwen/Qwen2.5-7B-Instruct"
  # base_url: "http://localhost:8000/v1"
  # api_key: "EMPTY"

  # General sampling parameters (can be overridden by the corresponding backend parameters in .env)
  temperature: 0.7
  top_p: 1.0
  max_tokens: 2048
  max_retries: 3
  retry_delay: 2.0

  # ---------------------------------------------------------------------------
  # [Single entry point] Module-level sampling parameter management
  # ---------------------------------------------------------------------------
  # Design principles:
  #   - Structured output (JSON / DAG) -> low temperature (0.1-0.3)
  #   - Scoring / attack / repair -> very low temperature (0.1) for consistency
  #   - Research / synthesis -> moderate temperature (0.5-0.7) to retain some creativity
  #   - Summarization / compression -> low temperature (0.1); no creativity needed
  #
  # ⚠️ Important: sampling parameters (temperature / max_tokens / top_p) for all modules
  #     are defined only here and are not repeated in the Agent YAMLs.
  #     This avoids configuration drift from inconsistencies between configs/agents/*.yaml and this file.
  # ---------------------------------------------------------------------------
  backend_sampling:
    # Global default sampling parameters for the Claude backend
    # Note: top_p is not configured -- some Claude models do not allow temperature and top_p to be specified together,
    #       and ClaudePolicy does not send top_p by default either.
    claude:
      temperature: 0.3
      max_tokens: 4096

    # Other backends (kept for comparison experiments; switch back in the mapping to use them)
    deepseek:
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0

    mimo:
      temperature: 0.3
      max_tokens: 4096
      top_p: 1.0

    # Module-level overrides (higher priority than the backend global defaults)
    # Format: module name -> {temperature, max_tokens, top_p}
    modules:
      # model_name specifies the Claude model for each module; if omitted, CLAUDE_MODEL from .env is used (default claude-sonnet-5-5)
      planner:
        model_name: "claude-sonnet-5-5"
        temperature: 0.3       # Generating a JSON DAG requires determinism
        max_tokens: 4096
      solver:
        model_name: "claude-sonnet-5-5"
        temperature: 0.5       # Research needs some flexibility, but numeric tasks should not diverge
        max_tokens: 4096
      summarizer:
        model_name: "claude-sonnet-5-5"
        temperature: 0.3       # Report synthesis: fluent but not divergent
        max_tokens: 16384      # Reports can be long, so give a generous token budget (switches to streaming automatically above 16384)
      red_agent:
        model_name: "claude-sonnet-5-5"
        temperature: 0.1       # Attacks must be rigorous and need almost no randomness
        max_tokens: 4096
      blue_agent:
        model_name: "claude-sonnet-5-5"
        temperature: 0.2       # Repair requires determinism
        max_tokens: 4096
      judge:
        model_name: "claude-sonnet-5-5"   # switch to claude-opus-5-5 for more stable scoring
        temperature: 0.0       # Scoring criteria must be consistent to avoid drift
        max_tokens: 2048
      compressor:
        model_name: "claude-haiku-5-5"    # Summarization is a structured task; use a small model to save cost
        temperature: 0.1
        max_tokens: 2048

  # ---------------------------------------------------------------------------
  # Backend assignment mapping (which module uses which backend)
  # ---------------------------------------------------------------------------
  backend_mapping:
    # If left empty, all modules use the default backend above
    solver: "claude"          # Main research Agent
    planner: "claude"         # Planner
    summarizer: "claude"      # Synthesizer
    judge: "claude"           # Scorer
    red_agent: "claude"       # Adversarial attack
    blue_agent: "claude"      # Adversarial repair
    compressor: "claude"      # Context compression (haiku specified above)

orchestrator:
  # M1: Multi-Agent Orchestrator configuration
  # Maximum number of sub-agents running concurrently
  max_concurrent: 5
  # Global timeout (seconds); the whole research flow is force-terminated once exceeded
  global_timeout_seconds: 600
  # Maximum number of replan rounds, to prevent infinite loops
  max_replan_rounds: 3
  # Maximum number of sub-questions a single plan may be split into
  max_sub_questions: 10
  # Maximum retries after a sub-agent execution failure
  max_subagent_retries: 2

planner:
  # M2: Adaptive Planner configuration
  # Maximum search/execution rounds allowed per sub-agent
  max_search_rounds_per_subagent: 5
  # Whether to enable dynamic plan adjustment (replan)
  enable_replan: true
  # Whether to automatically run a completeness check after plan execution
  enable_completeness_check: true

compressor:
  # M3: Context Compressor configuration
  # Maximum context length allowed before compression (in tokens)
  max_context_length: 120000   # Claude context is 1M; financial-report sections are long, so the original 16K budget is relaxed
  # Token budget reserved for output (so an answer can still be generated after compression)
  output_reserve_tokens: 2048
  # L1 coarse-filter threshold: documents below this similarity are discarded
  l1_threshold: 0.6
  # L2 fine-filter threshold: medium similarity, enters the summary candidate pool
  l2_threshold: 0.8
  # L3 retention threshold: original text above this similarity is kept in full
  l3_threshold: 0.95
  # Embedding model used for semantic similarity
  embedding_model: "all-MiniLM-L6-v2"
  # Whether to enable multi-level compression (L1-L3)
  enable_multilevel: true

memory:
  # M4: Shared Memory Store configuration
  # SQLite database file path
  db_path: "data/memory.db"
  # Maximum entries in the memory table; eviction is triggered when exceeded
  max_entries: 10000
  # Dedup similarity threshold: memories above this are treated as duplicates and not written again
  similarity_threshold_dup: 0.92
  # Conflict detection threshold: above this value but with contradictory content, conflict resolution is triggered
  similarity_threshold_conflict: 0.65
  # Run automatic eviction (LRU) after this many writes
  evict_interval: 100
  # Whether to enable the vector index (speeds up similarity search)
  enable_vector_index: true

adversarial:
  # M5: Red-Blue Adversarial Loop configuration
  # Master switch: whether to enable the adversarial denoising flow
  enabled: true
  # Maximum number of Red-Blue adversarial rounds
  max_rounds: 10
  # Blue Agent output quality score threshold; adversarial rounds stop early once reached
  score_threshold: 9.5
  # Score-difference threshold between adjacent rounds; below it counts as converged and stops early
  delta_threshold: 0.2
  # Whether to save logs for each adversarial round
  # Note: sampling parameters have moved to model.backend_sampling.modules and are no longer used here
  save_logs: true

evolution:
  # M6: Self-Evolution Engine configuration
  # Master switch: whether to enable online self-evolution training
  enabled: false
  # Total evolution rounds (GRPO iterations)
  num_rounds: 20
  # Number of queries sampled per round
  batch_size: 32
  # Sampling group size per query (GRPO group size)
  group_size: 8
  # Maximum interaction rounds per trajectory
  grpo_steps: 50
  # LoRA fine-tuning learning rate
  learning_rate: 5.0e-6
  # KL divergence penalty coefficient
  kl_coef: 0.01
  # LoRA low-rank dimension
  lora_rank: 16
  # Number of judge models in the ensemble (majority voting reduces variance)
  judge_ensemble_size: 3
  # Validate on the held-out calibration set every this many rounds
  held_out_calib_interval: 5
  # Run symbolic rule learning every this many rounds
  symbolic_learning_interval: 3

tools:
  # Global tool module configuration
  web_search:
    enabled: true
    # mock_mode: returns mock results when no real search API is available, for quick debugging
    mock_mode: false
    # Maximum results returned per search
    max_results: 10
    # Maximum tokens per search result snippet
    snippet_max_tokens: 512
  arxiv_reader:
    enabled: true
    # Maximum papers fetched per ArXiv query
    max_papers: 5
    # Maximum tokens per paper abstract
    abstract_max_tokens: 1024
  code_sandbox:
    enabled: false
    # Code execution timeout (seconds)
    timeout_seconds: 30
    # Maximum memory allowed (MB)
    memory_limit_mb: 512
