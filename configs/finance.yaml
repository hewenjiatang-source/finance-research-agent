# Finance / earnings-report research config; overrides configs/default.yaml.
#   python scripts/run_finance.py "Compare Apple FY2023 vs FY2022 revenue, net income and EPS, and explain the drivers"
extends: default.yaml
domain: finance

finance:
  language: en                 # en | zh  (report language; numbers, units and quotes stay as in the source)
  sec_user_agent: ""           # empty = read SEC_USER_AGENT from .env (SEC requires "Name email@example.com")
  max_tool_calls: 8            # tool-call budget per researcher sub-task (written into the prompt)
  researcher_max_turns: 12

orchestrator:
  max_sub_questions: 8
  global_timeout_seconds: 900

compressor:
  max_context_length: 150000

adversarial:
  enabled: true
  max_rounds: 3                # 3 rounds is enough here; default.yaml uses 10 (too costly)
  score_threshold: 9.0
  max_report_chars: 60000      # review the full report (upstream only reviewed the first 4000 chars)
  max_sources: 60

tools:
  web_search:
    mock_mode: false           # set true to debug without a search key; SEC tools are unaffected
  code_sandbox:
    enabled: false
