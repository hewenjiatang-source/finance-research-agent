# =============================================================================
# Web Search tool configuration
# =============================================================================
# Supports multiple search backends: mock (local simulation), serpapi, bing, google_custom_search
# =============================================================================

web_search:
  name: "web_search"
  description: "Get real-time web information through a web search engine"

  # Master switch
  enabled: true

  # Backend type: mock / serpapi / bing / google_custom_search
  backend: "mock"

  # ---------------------------------------------------------------------------
  # Mock mode configuration (used when there is no real API, for quick debugging)
  # ---------------------------------------------------------------------------
  mock:
    # Whether to enable mock
    enabled: true
    # Mock data file path (JSONL format, one preset result per line)
    mock_data_path: "data/mock_search_results.jsonl"
    # Whether to return a randomly generated placeholder snippet when there is no preset result
    fallback_to_random: true
    # Random snippet template pool
    random_templates:
      - "Recent research on {query} shows that this field is developing rapidly."
      - "{query} is a complex topic involving interdisciplinary research across multiple fields."
      - "According to authoritative sources, the key points of {query} include technological innovation and real-world deployment."

  # ---------------------------------------------------------------------------
  # SerpApi configuration (example of a real search backend)
  # ---------------------------------------------------------------------------
  serpapi:
    api_key: "${SERPAPI_KEY}"
    engine: "google"
    # Search region code
    gl: "us"
    # Interface language
    hl: "en"
    # Safe-search level: active / moderate / off
    safe: "active"

  # ---------------------------------------------------------------------------
  # General parameters
  # ---------------------------------------------------------------------------
  # Maximum results returned per search
  max_results: 10
  # Maximum tokens per search result snippet (truncated if longer)
  snippet_max_tokens: 512
  # Search timeout (seconds)
  timeout_seconds: 15
  # Number of retries on failure
  max_retries: 2
  # Retry interval (seconds)
  retry_delay: 1.0
  # Whether to cache search results (TTL in seconds)
  cache_enabled: true
  cache_ttl_seconds: 3600
