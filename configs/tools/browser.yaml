# =============================================================================
# Browser (web page reader) tool configuration
# =============================================================================
# Opens a URL and extracts the page body text; it is the downstream tool of web_search.
# web_search "finds links"; browser "reads the original content".
# =============================================================================

browser:
  name: "browser"
  description: "Open a URL and extract the web page body text"

  # Master switch
  enabled: true

  # ---------------------------------------------------------------------------
  # Network parameters
  # ---------------------------------------------------------------------------
  # HTTP request timeout (seconds)
  timeout_seconds: 15
  # User-Agent string
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  # Whether to follow redirects
  follow_redirects: true

  # ---------------------------------------------------------------------------
  # Content extraction parameters
  # ---------------------------------------------------------------------------
  # Default maximum characters returned (prevents very long pages from filling the context)
  max_chars: 8000
  # Noise tags (HTML tags removed directly during extraction)
  noise_tags:
    - "script"
    - "style"
    - "nav"
    - "header"
    - "footer"
    - "aside"
    - "noscript"
    - "iframe"
    - "svg"

  # ---------------------------------------------------------------------------
  # Failure handling
  # ---------------------------------------------------------------------------
  # Number of retries on request failure
  max_retries: 2
  # Retry interval (seconds, with exponential backoff)
  retry_delay: 1.0

  # ---------------------------------------------------------------------------
  # Dependency notes
  # ---------------------------------------------------------------------------
  # beautifulsoup4 must be installed for HTML parsing:
  #   pip install beautifulsoup4
  # If not installed, it automatically falls back to simple regex extraction (lower quality).
