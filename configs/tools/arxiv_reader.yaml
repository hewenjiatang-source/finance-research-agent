# =============================================================================
# ArXiv Reader tool configuration
# =============================================================================
# Searches academic papers via the ArXiv API and retrieves metadata such as title, authors, abstract, and PDF link.
# =============================================================================

arxiv_reader:
  name: "arxiv_reader"
  description: "Search and read academic paper abstracts and metadata via the ArXiv API"

  # Master switch
  enabled: true

  # ArXiv API endpoint
  api_endpoint: "http://export.arxiv.org/api/query"

  # ---------------------------------------------------------------------------
  # Query parameters
  # ---------------------------------------------------------------------------
  # Maximum papers returned per query
  max_papers: 5
  # Result sort field: relevance / lastUpdatedDate / submittedDate
  sort_by: "relevance"
  # Sort order: ascending / descending
  sort_order: "descending"
  # Default search field: all / title / author / abstract / comment / journal_reference / subject_category
  search_field: "all"

  # ---------------------------------------------------------------------------
  # Content processing parameters
  # ---------------------------------------------------------------------------
  # Maximum tokens per paper abstract (truncated if longer)
  abstract_max_tokens: 1024
  # Whether to fetch and parse the first N pages of the PDF (experimental; needs extra dependencies)
  fetch_pdf_preview: false
  pdf_preview_pages: 2
  # Whether to extract key entities from the paper (methods, datasets, metrics)
  extract_entities: false

  # ---------------------------------------------------------------------------
  # Network and cache parameters
  # ---------------------------------------------------------------------------
  # API request timeout (seconds)
  timeout_seconds: 20
  # Number of retries on failure
  max_retries: 3
  # Retry interval (seconds, with exponential backoff)
  retry_delay: 2.0
  # Whether to enable result caching
  cache_enabled: true
  cache_ttl_seconds: 86400

  # ---------------------------------------------------------------------------
  # Category filter (optional; restricts the search domain)
  # ---------------------------------------------------------------------------
  # Allowlist of ArXiv categories that may be searched; an empty list means no restriction
  allowed_categories:
    - "cs.AI"
    - "cs.CL"
    - "cs.LG"
    - "cs.IR"
    - "stat.ML"
