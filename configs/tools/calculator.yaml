# =============================================================================
# Calculator tool configuration
# =============================================================================
# A lightweight, safe, fast math expression calculator.
# Suited to simple arithmetic; use code_sandbox for complex scenarios.
# =============================================================================

calculator:
  name: "calculator"
  description: "Safely evaluate math expressions"

  # Master switch
  enabled: true

  # ---------------------------------------------------------------------------
  # Safety restrictions
  # ---------------------------------------------------------------------------
  # Allowed operators: +, -, *, /, **, %, unary +, unary -
  # Allowed functions:abs, round, max, min, sum, len, sqrt, sin, cos, tan,
  #            log, log10, exp, ceil, floor, factorial, mean, median,
  #            stdev, variance
  # Allowed constants:pi, e
  #
  # Forbidden: import, eval, exec, file operations, network requests, etc.
