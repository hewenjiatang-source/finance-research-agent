# =============================================================================
# File Reader tool configuration
# =============================================================================
# Reads local files and converts them into a text format the LLM can consume.
# =============================================================================

file_reader:
  name: "file_reader"
  description: "Read a local file (.txt/.md/.pdf/.csv/.json/.docx) and return its text content"

  # Master switch
  enabled: true

  # ---------------------------------------------------------------------------
  # Safety parameters
  # ---------------------------------------------------------------------------
  # Root directory that may be read (sandbox mode).
  # Setting it to null means no restriction (strongly recommended to set in production).
  allowed_base_dir: null
  # Maximum file size (bytes)
  max_file_size: 10485760  # 10 MB

  # ---------------------------------------------------------------------------
  # Format-specific parameters
  # ---------------------------------------------------------------------------
  # Number of CSV preview rows
  csv_preview_rows: 20
  # JSON maximum recursion depth
  json_max_depth: 3

  # ---------------------------------------------------------------------------
  # Supported formats and dependencies
  # ---------------------------------------------------------------------------
  # .txt / .md  → no extra dependencies needed
  # .pdf        → pdfplumber(recommended) or PyPDF2
  # .csv        → pandas
  # .json       → standard library json
  # .docx       → python-docx
  #
  # Install command:
  #   pip install pdfplumber pandas python-docx
