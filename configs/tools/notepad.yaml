# =============================================================================
# Notepad tool configuration
# =============================================================================
# The Agent's private scratchpad, used to record intermediate conclusions, to-do items, and search strategies.
# Pure in-memory implementation (session-scoped); not persisted.
# =============================================================================

notepad:
  name: "notepad"
  description: "Agent's personal scratchpad for intermediate conclusions and to-do items"

  # Master switch
  enabled: true

  # ---------------------------------------------------------------------------
  # Suggested note categories
  # ---------------------------------------------------------------------------
  # These are only suggestions; the Agent may use any string as a category.
  suggested_categories:
    - "conclusion"   # confirmed conclusions
    - "todo"         # to-do items (need later verification)
    - "question"     # unanswered questions
    - "source"       # records of important sources
    - "strategy"     # search strategy/plan

  # ---------------------------------------------------------------------------
  # Usage suggestions
  # ---------------------------------------------------------------------------
  # 1. After each round of key searching, use write to record the core findings.
  # 2. When a new point to verify is found, record it with write(category="todo").
  # 3. In long-horizon research (>5 rounds), use read to review the notes every 3 rounds.
  # 4. Avoid note bloat: a single read returns only the 10 most recent entries by default.
